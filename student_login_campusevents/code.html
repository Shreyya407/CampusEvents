<style>
        .shadow-ambient {
            box-shadow: 0px 10px 25px -5px rgba(9, 20, 38, 0.05), 0px 8px 10px -6px rgba(9, 20, 38, 0.02);
        }

<body class="bg-surface-container-low min-h-screen w-full flex items-center justify-center relative overflow-hidden font-body-md text-on-surface">
<!-- Professional Background Layer -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-low to-surface-container-high opacity-80 z-10"></div>
<div class="absolute inset-0 bg-cover bg-center z-0 mix-blend-overlay opacity-30" data-alt="A sophisticated architectural abstract background featuring the interior of a modern university building. The scene highlights clean geometric lines, polished concrete surfaces, and expansive glass panels that let in soft, diffused natural light. The aesthetic is strictly professional, highly polished, and academic, utilizing a light-mode color palette of pristine whites, subtle greys, and deep slate blue shadows to create a calm, focused atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBnm060QmYgAMM52ui43jKXMsihLxdjAlTKg9Ce-I8s7jGO_vt_FGTyOHyXJBKK9pXUEDvhnUOmiZ2KJNUoOf_cQKD_LWZ9WPBGV18niNowRmk7JeShVgbK4yPsXlccGQP49cwa0lsym87Irp27camktGzMhTz_4Vp54eRtL4-F9QPjwd0tBopkiFPMMeHnOieV8NEOIbQsZZBl61kiV6IAWS_ptXZc6rUQQGlMz2_sDEJG6lKqVB_4mw')"></div>
</div>
<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin-mobile md:px-0">
<div class="bg-surface rounded-xl shadow-ambient border border-outline-variant p-stack-lg w-full flex flex-col items-center">
<!-- Header Section -->
<div class="flex flex-col items-center mb-stack-lg w-full">
<!-- College Logo Placeholder -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-stack-md border border-outline-variant/30">
<span class="material-symbols-outlined text-[32px] text-secondary">school</span>
</div>
<!-- Application Name -->
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight text-center">
                    CampusEvents
                </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-stack-sm text-center">
                    Student Authentication Portal
                </p>
</div>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-stack-md" method="POST">
<!-- Email/Register Number Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="studentId">Student Email or Register Number</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="studentId" name="studentId" placeholder="Enter your credentials" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
<!-- Auxiliary Controls -->
<div class="flex items-center justify-between w-full mt-base">
<div class="flex items-center gap-stack-sm">
<input class="w-4 h-4 rounded border-outline-variant text-secondary bg-surface-container-lowest focus:ring-secondary focus:ring-offset-surface" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none cursor-pointer" for="remember">
                            Remember me
                        </label>
</div>
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-fixed-variant transition-colors underline-offset-4 hover:underline" href="#">
                        Forgot password?
                    </a>
</div>
<!-- Primary Action -->
<button class="w-full mt-stack-md bg-secondary text-on-secondary py-3 rounded-lg font-label-md text-label-md hover:bg-on-secondary-fixed-variant transition-colors flex items-center justify-center gap-stack-sm shadow-sm active:scale-[0.98]" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New student? 
                <a class="font-label-md text-label-md text-secondary hover:text-on-secondary-fixed-variant transition-colors underline-offset-4 hover:underline ml-1" href="#">
                    Register here
                </a>
</p>
</div>
</main>
</body></html>
